# eBlocker secure DNS: local DNSSEC validation only.
# CoreDNS filters first on port 5300, Unbound validates on 5354,
# then CoreDNS connects to the selected provider on loopback port 5355.
server:
    interface: 127.0.0.1@5354
    access-control: 127.0.0.0/8 allow
    module-config: "validator iterator"
    do-not-query-localhost: no
    val-permissive-mode: no

forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5355
    forward-first: no
